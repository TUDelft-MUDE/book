title: MUDE textbook
author: MUDE Teachers and the Student Army from Delft University of Technology
logo: https://github.com/TUDelft-MUDE/source-files/raw/main/file/MUDE_Logo-small.png

execute:
  execute_notebooks: "auto"

only_build_toc_files: true

html:
  baseurl :  "https://mude.citg.tudelft.nl/book/2026/"
  use_multitoc_numbering: false

sphinx:
  config:
    patch_config:
      disabled-patches: []
    html_show_copyright: false
    html_last_updated_fmt: ''
    html_js_files:
    - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    thebe_config:
      use_thebe_lite: true
      exclude_patterns: ["**/*.JPG", "**/*.PNG", "**/*.bib", "**/*.cpg", "**/*.csv", "**/*.dbf", "**/*.geojson", "**/*.gif", "**/*.html", "**/*.ico", "**/*.ipynb", "**/*.jl", "**/*.jpeg", "**/*.jpg", "**/*.json", "**/*.md", "**/*.npy", "**/*.pdf", "**/*.pptx", "**/*.png", "**/*.prj", "**/*.sbn", "**/*.sbx", "**/*.shp", "**/*.shx", "**/*.svg", "**/*.tif", "**/*.tiff", "**/*.txt", "**/*.webp", "**/*.whl", "**/*.xlsx", "**/*.xml", "**/*.yml", "**/*.zip"]
    html_theme_options:
      logo:
        text: Textbook
        link: "https://mude.citg.tudelft.nl/"
      repository_url: "https://github.com/TUDelft-MUDE/book"
      path_to_docs: "book"
      repository_branch: "2026-draft"
      use_edit_page_button: true
      use_repository_button: true
      use_issues_button : true
# START REMOVE-FROM-PUBLISH
      announcement: "<p>This book is under construction. The version currently shared with students: <a href='https://mude.citg.tudelft.nl/book' style='color: cyan;'>mude.citg.tudelft.nl/book</a></p>"
# END REMOVE-FROM-PUBLISH
      launch_buttons:
        thebe: true
# START REMOVE-FROM-PUBLISH
    keep_warnings: true
# END REMOVE-FROM-PUBLISH
    tud_change_logo: false
    tud_change_titlesize: false
    named_colors_custom_colors: {'attributiongrey':[150,150,150]}
    metadata_figure_settings:
      style: #BUMP
        admonition_class: attribution attributiongrey
      license:
        substitute_missing: true
      author:
        substitute_missing: true
        default_author: MUDE Teachers and the Student Army
      copyright:
        substitute_missing: true
        default_copyright: Delft University of Technology
    nb_execution_mode: "auto"
    nb_execution_includepatterns: 
       - "fem/matrix.ipynb"
       - "fem/discrete.ipynb"
    nb_execution_patterns_method: "only_include"

      
      
  extra_extensions:
    - teachbooks_favourites
    - sphinx_tudelft_theme
    - sphinx.ext.extlinks
    - sphinx_inline_tabs
    - sphinx_apa_references
    - sphinx_metadata_figure
    - sphinx_nb_execution_patterns

bibtex_bibfiles:
  - _bibliography/references.bib

teachbooks:
  attribution_color: attributiongrey
