<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Empirical PDF & CDF</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body{ margin:0; overflow:hidden; font-family:Helvetica, sans-serif; }
    
    rect.bin{ $1 shape-rendering:crispEdges; }
    rect.bin.active{ fill:red; stroke:red; stroke-width:2; opacity:1; }
    rect.bin:hover{ cursor:pointer; }
    .axis text{ font-family:Helvetica, sans-serif; }
  </style>
</head>
<body>
    <svg id="click"></svg>

<script>
/* ============================================================
   0.  CANVAS WITH 2:1 ASPECT (like side-by-side.html)
============================================================ */
const vw = Math.max(document.documentElement.clientWidth  || 0, window.innerWidth  || 0) * 0.95;
const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0) * 0.95;
const aspect = 2; // width : height
let width, height;
if (vw/aspect < vh){ width = vw; height = vw/aspect; } else { width = vh*aspect; height = vh; }

const svg  = d3.select('#click').attr('width',width).attr('height',height);
const fsz  = (12 * width / 600) + 'px';

/* ============================================================
   1.  DATA (hard-coded, no network fetch)
============================================================ */
const data = [
  0.98194733,  1.66749077, -0.13183068,  0.62309398,  1.26533973,
  5.61990436,  0.59890643,  0.26974686,  1.59431413,  0.40689944,
  0.83167375, -0.39046155, -0.77899569,  3.43545665,  4.83212914,
  2.37128186,  0.41411594,  0.22488237,  2.45569464, -0.07240572,
  2.33921594,  0.46462342,  0.93328153,  3.31543159,  3.07112015,
  0.25590279,  3.74990303,  2.43602711,  2.09708138,  2.19298702,
  1.24771668,  3.13445551,  0.78637088,  4.08218   ,  2.55974094,
  1.96489725,  1.84749238,  0.35578462,  1.20037955,  0.70761979,
  0.9685647 ,  1.05452713,  0.91675663,  1.64658074,  0.38682376,
 -0.18509724,  1.34094439,  3.83545275,  0.72670529,  1.74730972,
  1.9450609 ,  1.41811587,  1.57856068,  0.88364105,  1.4318066 ,
  0.55509721,  0.50513126,  0.91202747,  0.89708955,  2.01400649,
  1.25480656,  1.55071057, -0.5598337 ,  0.07888272,  2.02184443,
  1.88066812,  2.03572719,  1.23185395,  1.03162   ,  2.97535322,
  3.63460355,  1.29027105,  2.80923168,  0.27333185,  0.83156707,
  2.82236938,  0.84239514,  5.12162921,  2.65061315,  1.74307538,
  0.09949422, -0.08532181,  2.70532095,  3.11604433,  3.56610081,
  2.86152801,  0.13124214,  0.68736844,  4.23072539,  4.72905657,
  2.57271601,  1.29246143,  1.66392584,  1.96295435,  0.32413979,
  1.32740132,  1.38922566,  0.40388547, -0.09240789,  0.96563671
];
const N = data.length;

/* ============================================================
   2.  LAYOUT: two panes (PDF left, CDF right)
============================================================ */
const margin = {top: height*0.10, right: width*0.06, bottom: height*0.12, left: width*0.10};
const gap = width*0.06;                             // gap between panes
const innerW = width - margin.left - margin.right;  // full inner width for both panes
const innerH = height - margin.top - margin.bottom;

const paneW = (innerW - gap) / 2;
const leftX0  = margin.left;
const rightX0 = margin.left + paneW + gap;

/* Shared x-domain */
const xMin = d3.min(data), xMax = d3.max(data);
const pad = (xMax - xMin) * 0.03;
const xDomain = [xMin - pad, xMax + pad];

/* Scales */
const xPDF = d3.scaleLinear().domain(xDomain).range([leftX0,  leftX0  + paneW]);
const yPDF = d3.scaleLinear().range([margin.top + innerH, margin.top]);

const xCDF = d3.scaleLinear().domain(xDomain).range([rightX0, rightX0 + paneW]);
const yCDF = d3.scaleLinear().domain([0,1]).range([margin.top + innerH, margin.top]);

/* Axes */
const gXpdf = svg.append('g').attr('transform',`translate(0,${margin.top+innerH})`).style('font-size',fsz);
const gYpdf = svg.append('g').attr('transform',`translate(${leftX0},0)`).style('font-size',fsz);
const gXcdf = svg.append('g').attr('transform',`translate(0,${margin.top+innerH})`).style('font-size',fsz);
const gYcdf = svg.append('g').attr('transform',`translate(${rightX0},0)`).style('font-size',fsz);

/* Static subplot titles */
svg.append('text')
  .attr('x', leftX0 + paneW/2)
  .attr('y', margin.top - 12)
  .style('text-anchor','middle')
  .style('font-size', fsz)
  .text('empirical PDF');

svg.append('text')
  .attr('x', rightX0 + paneW/2)
  .attr('y', margin.top - 12)
  .style('text-anchor','middle')
  .style('font-size', fsz)
  .text('empirical CDF');

/* Axis labels */
svg.append('text')
  .attr('transform',`translate(${leftX0 + paneW/2},${height - margin.bottom*0.4})`)
  .style('text-anchor','middle').style('font-size',fsz).text('x');
svg.append('text')
  .attr('transform',`translate(${leftX0 - margin.left*0.55},${margin.top + innerH/2}) rotate(-90)`)
  .style('text-anchor','middle').style('font-size',fsz).text('interval probability');

svg.append('text')
  .attr('transform',`translate(${rightX0 + paneW/2},${height - margin.bottom*0.4})`)
  .style('text-anchor','middle').style('font-size',fsz).text('x');
svg.append('text')
  .attr('transform',`translate(${rightX0 + paneW + margin.right*0.45},${margin.top + innerH/2}) rotate(90)`)
  .style('text-anchor','middle').style('font-size',fsz).text('cumulative probability');

/* ============================================================
   3.  HISTOGRAM (empirical PDF)
============================================================ */
const thresholds = 12; // keep roughly similar bin count
// Force equal-width bins by constructing explicit edges from min to max
const K = thresholds;
const varstep = (xMax - xMin) / K;
const edges = d3.range(xMin, xMax, varstep);
edges.push(xMax);
const binGen = d3.bin().domain([xMin, xMax]).thresholds(edges);
const rawBins = binGen(data);
const bins = rawBins.map(b => ({ x0: b.x0, x1: b.x1, cnt: b.length, prob: b.length / N }));

const maxProb = d3.max(bins, b => b.prob) || 1e-12;
yPDF.domain([0, maxProb * 1.1]);

gXpdf.call(d3.axisBottom(xPDF).ticks(5));
gYpdf.call(d3.axisLeft(yPDF).ticks(5));

const barG = svg.append('g');

// (Re)define cumulative probabilities per bin to avoid any missing refs
const cumProbs = [];
{ let acc = 0; bins.forEach((b,i)=>{ cumProbs[i] = acc; acc += b.prob; }); }

// Force visually equal-width bars in pixels (use first bin as template)
const barRatio = 0.8;  // 80% of bin width
const bars = barG.selectAll('rect')
  .data(bins)
  .enter().append('rect')
    .attr('class','bin')
    .attr('x', b => { const bw = xPDF(b.x1)-xPDF(b.x0); return xPDF(b.x0) + (1-barRatio)*bw/2; })
    .attr('width', b => (xPDF(b.x1)-xPDF(b.x0))*barRatio )
    .attr('y', b => yPDF(b.prob))
    .attr('height', b => yPDF(0)-yPDF(b.prob))
    .attr('fill', '#ccc')
    .attr('stroke', 'none')
    .attr('y', b=> yPDF(b.prob))
    .attr('height',b=> yPDF(0)-yPDF(b.prob));

let acc = 0; bins.forEach((b,i)=>{ cumProbs[i]=acc; acc += b.prob; });

/* ============================================================
   4.  EMPIRICAL CDF (step function)
============================================================ */
const sorted = [...data].sort((a,b)=>a-b);
const cdfPts = [{x:xDomain[0], y:0}];
for(let i=0;i<sorted.length;i++) cdfPts.push({x:sorted[i], y:(i+1)/N});

const step = d3.line().curve(d3.curveStepAfter)
  .x(d=>xCDF(d.x)).y(d=>yCDF(d.y));

/* CDF background & highlight rectangle for hovered bin */
const cdfBg = svg.append('rect')
  .attr('x', rightX0).attr('y', margin.top)
  .attr('width', paneW).attr('height', innerH)
  .attr('fill', '#ffffff');

const cdfHi = svg.append('rect')
  .attr('x', rightX0).attr('y', margin.top)
  .attr('width', 0).attr('height', innerH)
  .attr('fill', 'red').attr('opacity', 0.5).style('pointer-events','none');

svg.append('path')
  .attr('d', step(cdfPts))
  .attr('fill','none')
  .attr('stroke','#666')
  .attr('stroke-width', 3 * height / 600);

gXcdf.call(d3.axisBottom(xCDF).ticks(5));
gYcdf.call(d3.axisLeft(yCDF).ticks(5));

/* Transparent hover zones on the CDF matching histogram bins */
const cdfZones = svg.append('g');
cdfZones.selectAll('rect')
  .data(bins)
  .enter().append('rect')
    .attr('x', b => xCDF(b.x0))
    .attr('y', margin.top)
    .attr('width', b => Math.max(1, xCDF(b.x1 - ((xMax - xMin) * 1e-9)) - xCDF(b.x0)))
    .attr('height', innerH)
    .attr('fill', 'transparent')
    .on('mouseover', (ev,b)=> highlightBin(b))
    .on('mouseout',  (ev,b)=> clearHighlight());

/* ============================================================
   5.  INTERACTION (sync highlight both ways)
============================================================ */
function highlightBin(b){
  // histogram bars (match hist.html behaviour with an explicit color/state)
  bars
    .attr('fill', d => d === b ? 'red' : '#ccc')
    .attr('stroke', d => d === b ? 'red' : 'none')
    .attr('stroke-width', d => d === b ? 2 : 0);
  // cdf region overlay
  const eps = (xMax - xMin) * 1e-9;
  cdfHi.attr('x', xCDF(b.x0)).attr('width', xCDF(b.x1 - eps) - xCDF(b.x0));
}

function clearHighlight(){
  bars.attr('fill', '#ccc').attr('stroke','none').attr('stroke-width',0);
  cdfHi.attr('width',0);
}

// Bind histogram hover to CDF highlight
bars.on('mouseover', (ev,b)=> highlightBin(b))
    .on('mouseout',  (ev,b)=> clearHighlight());

/* Init */
clearHighlight();

</script>
</body>
</html>
