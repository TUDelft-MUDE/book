}

// Initialize the lock and table state.
update_condition_visuals();

// ===================================================
// Interaction
// ===================================================
function set_condition(newSelected) {
  selected = newSelected;
  activeCell = null;
  reset_labels();
  update_condition_visuals();
  update_equation(null, null);
}

function selector(row, col) {
  // Only the free dimension matters. Moving anywhere in a column while a
  // row is locked selects that column within the locked row, and vice versa.
  let r, c;
  if (selected.slice(0,3) === "row") {
    r = +selected.slice(3);
    c = col;
  } else {
    r = row;
    c = +selected.slice(3);
  }
  activeCell = [r,c];
  reset_labels();
  update_condition_visuals();

  const denom = selected.slice(0,3) === "row" ? eye_marginals[r] : hair_marginals[c];
  const conditional = data[r][c] / denom;

  d3.select("#square"+r+c)
    .transition().duration(100)
    .style("fill", "grey")
    .style("opacity", 1);
  d3.select("#text"+r+c)
    .transition().duration(100)
    .style("opacity", 1)
    .text((conditional*100).toFixed(1)+"%");
  d3.select("#subtext"+r+c)
    .transition().duration(100)
    .style("opacity", 1)
    .text(data[r][c].toString());

  update_equation(r,c);
}

function update_condition_visuals() {
  const type = selected.slice(0,3);
  const idx = +selected.slice(3);

  // Locks
  for (let i=0; i<4; i++) {
    d3.select("#lock_eye"+i).style("opacity", type === "row" && i === idx ? 1 : 0);
    d3.select("#lock_hair"+i).style("opacity", type === "col" && i === idx ? 1 : 0);
  }

  // Table: the conditioned row/column is grey, everything else is white.
  for (let r=0; r<4; r++) {
    for (let c=0; c<4; c++) {
      const inCondition = (type === "row" && r === idx) || (type === "col" && c === idx);
      d3.select("#square"+r+c)
        .transition().duration(100)
        .style("fill", inCondition ? "#cccccc" : "white")
        .style("opacity", inCondition ? 1 : 0.25);
      d3.select("#text"+r+c)
        .transition().duration(100)
        .style("opacity", inCondition ? 1 : 0.25);
    }
  }

  // Category icons: keep the conditioned category prominent; leave the free
  // dimension available for inspection.
  for (let i=0; i<4; i++) {
    d3.selectAll(".eye"+i)
      .transition().duration(100)
      .style("opacity", type === "row" ? (i === idx ? 1 : 0.25) : 1);
    d3.selectAll(".hair"+i)
      .transition().duration(100)
      .style("opacity", type === "col" ? (i === idx ? 1 : 0.25) : 1);

    d3.select("#marg_row"+i)
      .transition().duration(100)
      .style("opacity", type === "row" && i === idx ? 1 : 0.25);
    d3.select("#text_marg_row"+i)
      .transition().duration(100)
      .style("opacity", type === "row" && i === idx ? 1 : 0.25);
    d3.select("#marg_col"+i)
      .transition().duration(100)
      .style("opacity", type === "col" && i === idx ? 1 : 0.25);
    d3.select("#text_marg_col"+i)
      .transition().duration(100)
      .style("opacity", type === "col" && i === idx ? 1 : 0.25);
  }

  // If a cell is active, restore its darker highlight after the base state.
  if (activeCell) {
    d3.select("#square"+activeCell[0]+activeCell[1]).style("fill", "grey").style("opacity", 1);
  }
}

function update_equation(row, col) {
  const type = selected.slice(0,3);
  const idx = +selected.slice(3);

  if (type === "row") {
    // p(hair | eye)
    d3.select("#eq_target_hair").style("opacity",1)
      .style("fill", col === null ? "white" : colors_hair[col]);
    d3.select("#eq_target_eye").style("opacity",0);
    d3.selectAll(".eqTargetEyePart").style("opacity",0);

    d3.select("#eq_condition_eye").style("opacity",1);
    d3.selectAll(".eqConditionEyePart").style("opacity",1);
    d3.selectAll(".eqConditionEyePart").filter(function(d,i) { return i===0; })
      .style("fill", colors_eye[idx]);
    d3.select("#eq_condition_hair").style("opacity",0);
    d3.select("#eq_denominator").text(eye_marginals[idx]);
  } else {
    // p(eye | hair)
    d3.select("#eq_target_hair").style("opacity",0);
    d3.select("#eq_target_eye").style("opacity",1);
    d3.selectAll(".eqTargetEyePart").style("opacity",1);
    d3.selectAll(".eqTargetEyePart").filter(function(d,i) { return i===0; })
      .style("fill", row === null ? "white" : colors_eye[row]);

    d3.select("#eq_condition_eye").style("opacity",0);
    d3.selectAll(".eqConditionEyePart").style("opacity",0);
    d3.select("#eq_condition_hair").style("opacity",1).style("fill", colors_hair[idx]);
    d3.select("#eq_denominator").text(hair_marginals[idx]);
  }

  if (row === null || col === null) {
    d3.select("#eq_numerator").text("?");
    d3.select("#eq_result").text("?");
  } else {
    const denom = type === "row" ? eye_marginals[idx] : hair_marginals[idx];
    d3.select("#eq_numerator").text(data[row][col]);
    d3.select("#eq_result").text((data[row][col]/denom).toFixed(3));
  }
}

// ===================================================
// Utility functions
// ===================================================
function reset_labels() {
  for (let r=0; r<4; r++) {
    for (let c=0; c<4; c++) {
      d3.select("#text"+r+c).text(data[r][c]);
      d3.select("#subtext"+r+c).style("opacity",0).text(data[r][c]);
    }
  }
}

function values_to_pixels(values,axis) {
  axis = (typeof axis === "undefined") ? "xy" : axis;
  if (axis === "x") {
    return (values-xrange[0])/(xrange[1]-xrange[0])*(window_x[1]-window_x[0])+window_x[0];
  } else if (axis === "y") {
    return (1-(values-yrange[0])/(yrange[1]-yrange[0]))*(window_y[1]-window_y[0])+window_y[0];
  }
  return [
    (values[0]-xrange[0])/(xrange[1]-xrange[0])*(window_x[1]-window_x[0])+window_x[0],
    (1-(values[1]-yrange[0])/(yrange[1]-yrange[0]))*(window_y[1]-window_y[0])+window_y[0]
  ];
}

function array_to_string(array) {
  var string = "";
  for (let row=0; row<array.length; row++) {
    string += array[row][0].toString()+","+array[row][1].toString()+" ";
  }
  return string;
}

function draw_marginal(index,dimension) {
  if (dimension === "x") {
    svg.append("polygon")
      .attr("points", array_to_string([
        values_to_pixels([1,index/4+0.025]),
        values_to_pixels([1+eye_marginals_normalized[index],index/4+0.025]),
        values_to_pixels([1+eye_marginals_normalized[index],(index+1)/4-0.025]),
        values_to_pixels([1,(index+1)/4-0.025])]))
      .style("fill", colors_eye[index])
      .style("stroke", "black")
      .attr("id", "marg_row"+index)
      .lower();
    svg.append("text")
      .text(eye_marginals[index].toString())
      .attr("font-size", height*0.05)
      .attr("text-anchor", "middle")
      .attr("transform", "translate("+values_to_pixels(1+eye_marginals_normalized[index]+0.025,"x")+","+values_to_pixels((index+0.5)/4,"y")+") rotate(90)")
      .attr("id", "text_marg_row"+index);
  } else {
    svg.append("polygon")
      .attr("points", array_to_string([
        values_to_pixels([index/4+0.025,1]),
        values_to_pixels([(index+1)/4-0.025,1]),
        values_to_pixels([(index+1)/4-0.025,1+hair_marginals_normalized[index]]),
        values_to_pixels([index/4+0.025,1+hair_marginals_normalized[index]])]))
      .style("fill", colors_hair[index])
      .style("stroke", "black")
      .attr("id", "marg_col"+index)
      .lower();
    svg.append("text")
      .text(hair_marginals[index].toString())
      .attr("font-size", height*0.05)
      .attr("text-anchor", "middle")
      .attr("transform", "translate("+values_to_pixels((index+0.5)/4,"x")+","+values_to_pixels(1+hair_marginals_normalized[index]+0.08,"y")+")")
      .attr("id", "text_marg_col"+index);
  }
}
</script>
