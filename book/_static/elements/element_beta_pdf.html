<!DOCTYPE html>
<html>
  <head>
    <script src="https://unpkg.com/mathjs/lib/browser/math.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
    <script src="https://d3js.org/d3.v4.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Helvetica, sans-serif;
      }
      .tickLabel {
        position: absolute;
        transform: translateX(-50%);
        pointer-events: none;
      }
      .sliderLabel {
        position: absolute;
        pointer-events: none;
      }
    </style>
  </head>
  <body>

    <div id="my_datavisualization">
      <svg id="click" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <script>
      // Viewport & SVG sizing
      const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0) * 0.95;
      const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0) * 0.95;
      const aspect = 1.5;
      let width, height;
      if (vw / aspect < vh) { width = vw; height = vw / aspect; } else { width = vh * aspect; height = vh; }

      var svg = d3.select('#click').attr('width', width).attr('height', height);

      // Scale factor tied to your existing SVG scaling
      const uiScale = height / 600;          // same logic you use for stroke widths, etc.
      const trackH  = 15 * uiScale;           // slider track thickness
      const thumbSz = 25 * uiScale;          // thumb diameter

      // Create or update a <style> block dynamically
      let styleEl = document.getElementById('sliderDynCSS');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'sliderDynCSS';
        document.head.appendChild(styleEl);
      }

      styleEl.textContent = `
      /* Base style */
      input[type=range]{
        -webkit-appearance: none;
        appearance: none;
        width: auto;
        height: ${trackH}px; /* Firefox uses this, WebKit not always */
        background: transparent; /* so the track pseudo-element is visible */
        margin: 0;
        padding: 0;
      }

      /* WebKit track & thumb */
      input[type=range]::-webkit-slider-runnable-track{
        height: ${trackH}px;
        background: #ccc;
        border-radius: ${trackH/2}px;
      }
      input[type=range]::-webkit-slider-thumb{
        -webkit-appearance: none;
        appearance: none;
        width: ${thumbSz}px;
        height: ${thumbSz}px;
        border-radius: 50%;
        background: #666;
        margin-top: calc(${trackH}px / 2 - ${thumbSz}px / 2); /* center thumb over track */
      }

      /* Firefox track & thumb */
      input[type=range]::-moz-range-track{
        height: ${trackH}px;
        background: #ccc;
        border-radius: ${trackH/2}px;
      }
      input[type=range]::-moz-range-thumb{
        width: ${thumbSz}px;
        height: ${thumbSz}px;
        border-radius: 50%;
        background: #666;
        border: none;
      }

      /* (Optional) MS/Edge (legacy) */
      input[type=range]::-ms-track{
        height: ${trackH}px;
        background: transparent;
        border-color: transparent;
        color: transparent;
      }
      input[type=range]::-ms-fill-lower{
        background: #ccc;
        border-radius: ${trackH/2}px;
      }
      input[type=range]::-ms-fill-upper{
        background: #ccc;
        border-radius: ${trackH/2}px;
      }
      input[type=range]::-ms-thumb{
        width: ${thumbSz}px;
        height: ${thumbSz}px;
        border-radius: 50%;
        background: #666;
        border: none;
      }
      `;


      // Beta parameters
      var Beta_a = 4;
      var Beta_b = 2;

      // Helpers
      function linspace(start, end, resolution) {
        var spacing = [];
        for (var i = 0; i < resolution; i++) spacing.push(start + (end - start) * i / (resolution - 1));
        return spacing;
      }

      function logGamma(z) {
        var g = 7;
        var p = [0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
        if (z < 0.5) {
          return Math.log(Math.PI) - Math.log(Math.sin(Math.PI * z)) - logGamma(1 - z);
        } else {
          z = z - 1; var x = p[0];
          for (var i = 1; i < p.length; i++) x += p[i] / (z + i);
          var t = z + g + 0.5;
          return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
        }
      }

      function betaPDF(x) {
        const alpha = Beta_a, beta = Beta_b;
        if (alpha <= 0 || beta <= 0) return 0;
        const eps = 1e-15;
        if (x <= 0) x = eps; else if (x >= 1) x = 1 - eps;
        var logNumerator = (alpha - 1) * Math.log(x) + (beta - 1) * Math.log(1 - x);
        var logDenom = logGamma(alpha) + logGamma(beta) - logGamma(alpha + beta);
        return Math.exp(logNumerator - logDenom);
      }

      function evaluate_pdf(arr) {
        var out = [];
        for (let i = 0; i < arr.length; i++) out.push(betaPDF(arr[i]));
        return out;
      }

      function evaluate_cdf(x, pdf) {
        var cdf = [0];
        for (let i = 1; i < x.length; i++) {
          var dx = x[i] - x[i-1];
          var area = 0.5 * (pdf[i] + pdf[i-1]) * dx;
          cdf.push(cdf[i-1] + area);
        }
        var total = cdf[cdf.length-1];
        for (let j = 0; j < cdf.length; j++) cdf[j] /= total;
        return cdf;
      }

      // Plot windows
      const x_limits = [0,1];
      const y_limits_pdf = [0,1];
      const y_limits_cdf = [0,1];

      const window_x_pdf = [width * 0.1,  width * 0.45];
      const window_y_pdf = [height * 0.1, height * 0.6];

      const window_x_cdf = [width * 0.6, width * 0.95];
      const window_y_cdf = [height * 0.1, height * 0.6];

      // Scales
      const xScale_pdf = d3.scaleLinear().domain(x_limits).range(window_x_pdf);
      const xScale_pdf_inverse = d3.scaleLinear().domain(window_x_pdf).range(x_limits);
      const yScale_pdf = d3.scaleLinear().domain(y_limits_pdf).range([window_y_pdf[1], window_y_pdf[0]]);

      const xScale_cdf = d3.scaleLinear().domain(x_limits).range(window_x_cdf);
      const yScale_cdf = d3.scaleLinear().domain(y_limits_cdf).range([window_y_cdf[1], window_y_cdf[0]]);

      // Axes
      var xAxis_pdf = d3.axisBottom(xScale_pdf).ticks(5);
      var yAxis_pdf = d3.axisLeft(yScale_pdf);
      var xAxis_cdf = d3.axisBottom(xScale_cdf).ticks(5);
      var yAxis_cdf = d3.axisLeft(yScale_cdf);

      var tickFontSize = (12 * width / 600) + 'px';

      var xaxis_pdf = svg.append('g')
        .attr('transform', 'translate(0,' + window_y_pdf[1] + ')')
        .call(xAxis_pdf)
        .style('font-size', tickFontSize);

      svg.append('text')
        .attr('transform', 'translate(' + ((window_x_pdf[0] + window_x_pdf[1]) / 2) + ',' + (height * 0.675) + ')')
        .style('text-anchor', 'middle')
        .text('x')
        .style('font-size', tickFontSize);

      var yaxis_pdf = svg.append('g')
        .attr('transform', 'translate(' + window_x_pdf[0] + ',0)')
        .call(yAxis_pdf)
        .style('font-size', tickFontSize);

      svg.append('text')
        .attr('transform', 'translate(' + (width * 0.05) + ',' + ((window_y_pdf[0] + window_y_pdf[1]) / 2) + ') rotate(270)')
        .style('text-anchor', 'middle')
        .text('probability density')
        .style('font-size', tickFontSize);

      var xaxis_cdf = svg.append('g')
        .attr('transform', 'translate(0,' + window_y_cdf[1] + ')')
        .call(xAxis_cdf)
        .style('font-size', tickFontSize);

      svg.append('text')
        .attr('transform', 'translate(' + ((window_x_cdf[0] + window_x_cdf[1]) / 2) + ',' + (height * 0.675) + ')')
        .style('text-anchor', 'middle')
        .text('x')
        .style('font-size', tickFontSize);

      var yaxis_cdf = svg.append('g')
        .attr('transform', 'translate(' + window_x_cdf[0] + ',0)')
        .call(yAxis_cdf)
        .style('font-size', tickFontSize);

      svg.append('text')
        .attr('transform', 'translate(' + (width * 0.55) + ',' + ((window_y_cdf[0] + window_y_cdf[1]) / 2) + ') rotate(270)')
        .style('text-anchor', 'middle')
        .text('cumulative probability')
        .style('font-size', tickFontSize);

      // Initial data
      var N = Math.max(201, Math.ceil(Math.max(Beta_a, Beta_b) * 10));
      var x = linspace(0,1,N);
      var pdf = evaluate_pdf(x);
      var cdf = evaluate_cdf(x,pdf);

      var data_pdf = x.map((xi,i)=>({x:xi,y:pdf[i]}));
      var data_cdf = x.map((xi,i)=>({x:xi,y:cdf[i]}));

      var valueline_pdf = d3.svg.line().x(d=>xScale_pdf(d.x)).y(d=>yScale_pdf(d.y));
      var valueline_cdf = d3.svg.line().x(d=>xScale_cdf(d.x)).y(d=>yScale_cdf(d.y));

      svg.append('path')
        .attr('class','line')
        .attr('d', valueline_pdf(data_pdf))
        .attr('fill','none')
        .attr('stroke-width', 3 * height / 600)
        .attr('stroke','#666666')
        .attr('id','line_pdf');

      svg.append('path')
        .attr('class','line')
        .attr('d', valueline_cdf(data_cdf))
        .attr('fill','none')
        .attr('stroke-width', 3 * height / 600)
        .attr('stroke','#666666')
        .attr('id','line_cdf');

      function updatePlots(duration=300){
        var N = Math.max(201, Math.ceil(Math.max(Beta_a, Beta_b) * 10));
        x = linspace(0,1,N);
        pdf = evaluate_pdf(x);
        cdf = evaluate_cdf(x,pdf);

        var data_pdf = x.map((xi,i)=>({x:xi,y:pdf[i]}));
        var data_cdf = x.map((xi,i)=>({x:xi,y:cdf[i]}));

        var maxval = d3.max(pdf); if (isNaN(maxval) || maxval < 1) maxval = 1;
        yScale_pdf.domain([0, maxval * 1.2]);

        d3.select('#line_pdf')
          .transition().duration(duration)
          .attr('d', valueline_pdf(data_pdf));
        yaxis_pdf.transition().duration(300).call(d3.axisLeft(yScale_pdf));

        d3.select('#line_cdf')
          .transition().duration(duration)
          .attr('d', valueline_cdf(data_cdf));
        yaxis_cdf.transition().duration(300).call(d3.axisLeft(yScale_cdf));
      }

      // Alpha label
      svg.append('text')
        .attr('transform', 'translate(' + ((window_x_pdf[0] + window_x_pdf[1]) / 2) + ',' + (height * 0.75) + ')')
        .style('text-anchor', 'middle')
        .text('alpha')
        .style('font-size', tickFontSize);

      // Alpha slider
      var alphaSlider = document.createElement('input');
      alphaSlider.type = 'range';
      alphaSlider.id   = 'alphaSlider';
      alphaSlider.min  = 1;
      alphaSlider.max  = 5;
      alphaSlider.step = 0.01;
      alphaSlider.value = Beta_a;
      alphaSlider.style.position = 'absolute';
      alphaSlider.style.left = (width*0.1).toString() + 'px';
      alphaSlider.style.top  = (height*0.775).toString()  + 'px';
      alphaSlider.style.width = (width*0.35).toString() + 'px';
      alphaSlider.style.margin = '0';
      alphaSlider.style.padding = '0';
      document.body.appendChild(alphaSlider);

      // Alpha ticks (integers only)
      for (let v = 1; v <= 5; v++) {

        var pct = (v - 1) / (5 - 1);

        svg.append('text')
          .attr('transform', 'translate(' + (width*0.1 + pct * width*0.35).toString() + ',' + (height * 0.835).toString() + ')')
          .style('text-anchor', 'middle')
          .text(v)
          .style('font-size', tickFontSize);

      }

      alphaSlider.addEventListener('input', function(){
        Beta_a = +this.value;
        updatePlots(0);
      });

      // Beta label
      svg.append('text')
        .attr('transform', 'translate(' + ((window_x_pdf[0] + window_x_pdf[1]) / 2) + ',' + (height * 0.8975) + ')')
        .style('text-anchor', 'middle')
        .text('beta')
        .style('font-size', tickFontSize);

      // Beta slider
      var betaSlider = document.createElement('input');
      betaSlider.type = 'range';
      betaSlider.id   = 'alphaSlider';
      betaSlider.min  = 1;
      betaSlider.max  = 5;
      betaSlider.step = 0.01;
      betaSlider.value = Beta_b;
      betaSlider.style.position = 'absolute';
      betaSlider.style.left = (width*0.1).toString() + 'px';
      betaSlider.style.top  = (height*0.925).toString()  + 'px';
      betaSlider.style.width = (width*0.35).toString() + 'px';
      betaSlider.style.margin = '0';
      betaSlider.style.padding = '0';
      document.body.appendChild(betaSlider);

      // Alpha ticks (integers only)
      for (let v = 1; v <= 5; v++) {

        var pct = (v - 1) / (5 - 1);

        svg.append('text')
          .attr('transform', 'translate(' + (width*0.1 + pct * width*0.35).toString() + ',' + (height * 0.985).toString() + ')')
          .style('text-anchor', 'middle')
          .text(v)
          .style('font-size', tickFontSize);

      }

      betaSlider.addEventListener('input', function(){
        Beta_b = +this.value;
        updatePlots(0);
      });

      // Initial draw
      updatePlots();

    </script>
  </body>
</html>
