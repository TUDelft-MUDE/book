<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>QQ plot — empirical vs theoretical</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body{ margin:0; overflow:hidden; font-family:Helvetica, sans-serif; }
    .axis text{ font-family:Helvetica, sans-serif; }
    .cdf-th{ stroke:#666; stroke-width:2; fill:none; }
    .cdf-emp{ stroke:#333; stroke-width:2; fill:none; }
    .ks-gap{ stroke:red; stroke-width:2; }
    #ui label{ display:block; margin:8px 0 2px; }
    #ui input[type=range]{ width:100%; }
    #ui select{ width:100%; }
    svg{ position:absolute; top:0; left:0; background-color: None; }
  </style>
</head>
<body>
  <svg id="click"></svg>
  <div id="ui" style="position:absolute;"></div>
<script>
// =============================================================================
// 0) Stage & layout
// =============================================================================
const vw = Math.max(document.documentElement.clientWidth  || 0, window.innerWidth  || 0) * 0.95
const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0) * 0.95
const aspect = 2
var width, height
if (vw/aspect < vh){ width = vw; height = vw/aspect } else { width = vh*aspect; height = vh }

var svg  = d3.select("#click").attr("width",width).attr("height",height)
const fsz  = (12 * width / 600).toString() + "px"

const margin = {top: height*0.10, right: width*0.06, bottom: height*0.12, left: width*0.10}
const gap = width*0.06
const inner_w = width - margin.left - margin.right
const inner_h = height - margin.top - margin.bottom
const pane_w = (inner_w - gap) / 2
const left_x0  = margin.left
const right_x0 = margin.left + pane_w + gap

// =============================================================================
// 1) Data (hard-coded)
// =============================================================================
const data = [
  0.98194733,1.66749077,-0.13183068,0.62309398,1.26533973,5.61990436,0.59890643,0.26974686,1.59431413,0.40689944,
  0.83167375,-0.39046155,-0.77899569,3.43545665,4.83212914,2.37128186,0.41411594,0.22488237,2.45569464,-0.07240572,
  2.33921594,0.46462342,0.93328153,3.31543159,3.07112015,0.25590279,3.74990303,2.43602711,2.09708138,2.19298702,
  1.24771668,3.13445551,0.78637088,4.08218,2.55974094,1.96489725,1.84749238,0.35578462,1.20037955,0.70761979,
  0.9685647,1.05452713,0.91675663,1.64658074,0.38682376,-0.18509724,1.34094439,3.83545275,0.72670529,1.74730972,
  1.9450609,1.41811587,1.57856068,0.88364105,1.4318066,0.55509721,0.50513126,0.91202747,0.89708955,2.01400649,
  1.25480656,1.55071057,-0.5598337,0.07888272,2.02184443,1.88066812,2.03572719,1.23185395,1.03162,2.97535322,
  3.63460355,1.29027105,2.80923168,0.27333185,0.83156707,2.82236938,0.84239514,5.12162921,2.65061315,1.74307538,
  0.09949422,-0.08532181,2.70532095,3.11604433,3.56610081,2.86152801,0.13124214,0.68736844,4.23072539,4.72905657,
  2.57271601,1.29246143,1.66392584,1.96295435,0.32413979,1.32740132,1.38922566,0.40388547,-0.09240789,0.96563671
]
const N = data.length
const empirical = data.slice().sort((a,b)=>a-b)
const probs = empirical.map((_,i)=>(i+0.5)/N) // (not displayed, kept for parity)

// =============================================================================
// 2) Scales & axes
// =============================================================================
const x = d3.scaleLinear().range([left_x0, left_x0 + pane_w])
const y = d3.scaleLinear().range([margin.top + inner_h, margin.top])

const g_x = svg.append("g").attr("transform","translate(0," + (margin.top+inner_h).toString() + ")").style("font-size",fsz)
const g_y = svg.append("g").attr("transform","translate(" + (left_x0).toString() + ",0)").style("font-size",fsz)

const th_line  = d3.line().x(d=>x(d.x)).y(d=>y(d.y))
const emp_step = d3.line().curve(d3.curveStepAfter).x(d=>x(d.x)).y(d=>y(d.y))

svg.append("text")
  .attr("x", (left_x0 + pane_w/2).toString())
  .attr("y", (margin.top - 12).toString())
  .style("text-anchor","middle")
  .style("font-size", fsz)
  .attr("id","ks-title")
  .text("KS: —")

svg.append("text")
  .attr("transform","translate(" + ((left_x0 + pane_w/2)).toString() + "," + (height - margin.bottom*0.4).toString() + ")")
  .style("text-anchor","middle").style("font-size",fsz).text("x")

svg.append("text")
  .attr("transform","translate(" + (left_x0 - margin.left*0.55).toString() + "," + (margin.top + inner_h/2).toString() + ") rotate(-90)")
  .style("text-anchor","middle").style("font-size",fsz).text("CDF")

const th_path = svg.append("path").attr("class","cdf-th")
const emp_path = svg.append("path").attr("class","cdf-emp")
const gap_line = svg.append("line").attr("class","ks-gap")

// =============================================================================
// 3) Distributions
// =============================================================================
function erf(v){ const s=v<0?-1:1; v=Math.abs(v); const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911; const t=1/(1+p*v); const y=1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-v*v); return s*y }
function norm_cdf(z){ return 0.5*(1+erf(z/Math.SQRT2)) }

const dist_defs = {
  gaussian: {
    name: "Gaussian PDF",
    params: [
      {key:"mu",  label:"mean (\u03BC)",  min: null, max: null, val: 0, step: 0.01},
      {key:"sig", label:"stdev (\u03C3)", min: 0.05, max: null, val: 1, step: 0.01}
    ],
    cdf: (xv, {mu, sig}) => norm_cdf((xv - mu)/sig)
  },
  gumbel: {
    name: "Gumbel PDF",
    params: [
      {key:"mu",   label:"location (\u03BC)", min: null, max: null, val: 0, step: 0.01},
      {key:"beta", label:"scale (\u03B2)",    min: 0.05, max: null, val: 1, step: 0.01}
    ],
    cdf: (xv, {mu, beta}) => Math.exp(-Math.exp(-(xv - mu)/beta))
  },
  exponential: {
    name: "Exponential PDF",
    params: [
      {key:"lambda", label:"rate (\u03BB)", min: 0.01, max: 5, val: 1, step: 0.01}
    ],
    cdf: (xv, {lambda}) => (xv < 0 ? 0 : 1 - Math.exp(-lambda * xv))
  }
}

// optional normal quantile (kept for parity)
function norm_inv(p){
  if (p <= 0 || p >= 1) return NaN
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239]
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01]
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783]
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996,3.754408661907416]
  const plow=0.02425, phigh=1-plow
  let q, r
  if (p < plow){
    q=Math.sqrt(-2*Math.log(p))
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)
  }
  if (phigh < p){
    q=Math.sqrt(-2*Math.log(1-p))
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)
  }
  q = p - 0.5; r = q*q
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)
}

// =============================================================================
// 4) UI (right pane)
// =============================================================================
const ui = d3.select("#ui")
  .style("left", (right_x0).toString() + "px")
  .style("top",  (margin.top).toString() + "px")
  .style("width",(pane_w).toString() + "px")
  .style("font-size", fsz)

ui.append("div").style("margin-bottom","6px")
  .append("label").text("Distribution")

const select_el = ui.append("select")
  .on("change", function(){ render_params(this.value) })

select_el.selectAll("option")
  .data(Object.keys(dist_defs))
  .enter().append("option")
    .attr("value", d => d)
    .text(d => dist_defs[d].name)

const params_div = ui.append("div").attr("id","params")

const d_min = d3.min(data), d_max = d3.max(data)
const mean = d3.mean(data)
const sd = Math.sqrt(d3.mean(data.map(v => (v-mean)*(v-mean))))

function render_params(kind){
  params_div.html("")
  const def = dist_defs[kind]
  def.params.forEach(p => {
    if (p.min == null) p.min = Math.min(d_min - sd*2, mean - sd*3)
    if (p.max == null) p.max = Math.max(d_max + sd*2, mean + sd*3)
    if (kind==="gaussian" && p.key==="sig"){ p.min = Math.max(0.05, sd*0.25); p.max = Math.max(1, sd*3); p.val = Math.max(0.1, sd) }
    if (kind==="gumbel"   && p.key==="beta"){ p.min = Math.max(0.05, sd*0.25); p.max = Math.max(1, sd*3); p.val = Math.max(0.1, sd*Math.SQRT6/Math.PI) }
    if (kind==="exponential" && p.key==="lambda"){ p.min = 0.01; p.max = Math.max(5, 1/Math.max(0.1, mean)); p.val = 1 }

    const wrap = params_div.append("div")
    wrap.append("label").text(p.label)
    const row = wrap.append("div")
    const inp = row.append("input")
      .attr("type","range")
      .attr("min", p.min)
      .attr("max", p.max)
      .attr("step", p.step)
      .attr("value", p.val)
      .on("input", update_ks)
    row.append("span")
      .style("float","right")
      .style("margin-left","8px")
      .attr("class","val")
      .text(p.val.toFixed(3))
    p._input = inp
    p._readout = row.select("span")
  })
  update_ks()
}

select_el.property("value","gaussian")
render_params("gaussian")

// =============================================================================
// 5) Update & draw
// =============================================================================
function current_params(kind){
  const out = {}
  dist_defs[kind].params.forEach(p => { out[p.key] = +p._input.node().value })
  return out
}

function update_ks(){
  const kind = d3.select("#ui select").node().value
  dist_defs[kind].params.forEach(p => p._readout.text((+p._input.node().value).toFixed(3)))
  const params = current_params(kind)
  const cdf = xv => dist_defs[kind].cdf(xv, params)

  const xmin = d3.min(empirical), xmax = d3.max(empirical)
  const pad = (xmax - xmin) * 0.03 || 1e-6
  x.domain([xmin - pad, xmax + pad])
  y.domain([0,1])

  g_x.call(d3.axisBottom(x).ticks(5))
  g_y.call(d3.axisLeft(y).ticks(5))

  const xs = d3.range(0,200).map(i => {
    const xx = (xmin - pad) + (i/199) * ((xmax + pad) - (xmin - pad))
    return { x:xx, y:cdf(xx) }
  })
  th_path.attr("d", th_line(xs))

  const emp_pts = [{x: x.domain()[0], y:0}]
  for (var i=0;i<N;i++) emp_pts.push({ x:empirical[i], y:(i+1)/N })
  emp_pts.push({ x:x.domain()[1], y:1 })
  emp_path.attr("d", emp_step(emp_pts))

  let best = {D:0, x:empirical[0], yEmp:0, yTh:0, side:"plus"}
  for (var j=0;j<N;j++){
    const Fxi = cdf(empirical[j])
    const Dplus  = (j+1)/N - Fxi
    const Dminus = Fxi - j/N
    if (Dplus  > best.D){ best = {D:Dplus,  x:empirical[j], yEmp:(j+1)/N, yTh:Fxi, side:"plus"} }
    if (Dminus > best.D){ best = {D:Dminus, x:empirical[j], yEmp:j/N,     yTh:Fxi, side:"minus"} }
  }

  gap_line
    .attr("x1", x(best.x))
    .attr("x2", x(best.x))
    .attr("y1", y(best.yEmp))
    .attr("y2", y(best.yTh))

  d3.select("#ks-title").text(dist_defs[kind].name + " — KS D = " + best.D.toFixed(4))
}

d3.select("#ui").style("font-size", fsz)
</script>
</body>
</html>
