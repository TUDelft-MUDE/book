<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body{ margin:0; overflow:hidden; font-family:Helvetica, sans-serif; }
    #chart-title{
      position:absolute; top:6px; margin:0; font-weight:normal;
      transform:translateX(-50%);
    }
    .tooltip{
      position:absolute; background:#fff; border:1px solid #999;
      padding:3px 6px; font-size:12px; pointer-events:none;
    }
    rect.bin:hover{ cursor:pointer; }
    svg{ position:absolute; top:0; left:0; background-color: None; }
  </style>
</head>
<body>
  <h2 id="chart-title">loading…</h2>
  <div id="tooltip" class="tooltip" style="display:none;"></div>
  <svg id="click"></svg>

<script>
// =============================================================================
// 0. SQUARE CANVAS & PLOT FRAME
// =============================================================================
const side = Math.min(
  Math.max(document.documentElement.clientWidth , window.innerWidth ) * 0.95,
  Math.max(document.documentElement.clientHeight, window.innerHeight) * 0.95
)

const svg  = d3.select('#click').attr('width',side).attr('height',side)
const fsz  = (12 * side / 600).toString() + 'px'
const title_sel = d3.select('#chart-title').style('font-size', fsz)

// margins
const margin = {top: side*0.08, right: side*0.08, bottom: side*0.10, left: side*0.12}
const plot_w  = side - margin.left - margin.right
const plot_h  = side - margin.top  - margin.bottom

// center the external title on the x-axis
title_sel.style('left', (margin.left + plot_w/2).toString() + 'px')

// scales
const x = d3.scaleLinear().range([margin.left, margin.left + plot_w])
const y = d3.scaleLinear().range([margin.top + plot_h, margin.top]) // inverted

// axes
const g_x = svg.append('g')
  .attr('transform', 'translate(0,' + (margin.top + plot_h).toString() + ')')
  .style('font-size', fsz)

const g_y = svg.append('g')
  .attr('transform', 'translate(' + (margin.left).toString() + ',0)')
  .style('font-size', fsz)

// axis labels
svg.append('text')
  .attr('transform','translate(' + (margin.left + plot_w/2).toString() + ',' + (side - margin.bottom*0.4).toString() + ')')
  .style('text-anchor','middle').style('font-size', fsz)
  .text('wind speed\u00A0[m/s]')
  .attr('id','text_xlabel')

svg.append('text')
  .attr('transform','translate(' + (margin.left*0.4).toString() + ',' + (margin.top + plot_h/2).toString() + ') rotate(-90)')
  .style('text-anchor','middle').style('font-size', fsz)
  .text('interval probability')
  .attr('id','text_ylabel')

// tooltip (kept for parity; hidden during interaction)
const tip = d3.select('#tooltip')

// =============================================================================
// 1. DATA (live fetch with local fallback)
// =============================================================================
const now = new Date()
const end_date = now.toISOString().slice(0,10)
const start_date = new Date(now); start_date.setDate(start_date.getDate()-364)
const start_str = start_date.toISOString().slice(0,10)

const lat=52.00667, lon=4.35556
const live_url =
  'https://archive-api.open-meteo.com/v1/archive?latitude=' + lat
  + '&longitude=' + lon
  + '&start_date=' + start_str
  + '&end_date=' + end_date
  + '&hourly=wind_speed_10m&timezone=Europe%2FAmsterdam'

const backup_url = 'delft_2024_wind.json'

let latest_obs
let bins

load(live_url).catch(e=>load(backup_url, true)).catch(fatal)

// =============================================================================
// 2. HISTOGRAM
// =============================================================================
function draw_histogram(data, is_backup){
  // bins
  const max_speed = d3.max(data, d=>d.speed)
  const edges = d3.ticks(0, max_speed, 10)

  bins = []
  for (let i=0;i<edges.length-1;i++){
    bins.push({x0:edges[i], x1:edges[i+1], cnt:0})
  }

  data.forEach(d=>{
    const b = bins.find(b=>d.speed>=b.x0 && d.speed<b.x1) || bins[bins.length-1]
    b.cnt++
  })

  // probabilities
  const N = data.length
  bins.forEach(b=> b.prob = b.cnt / N)
  const max_prob = d3.max(bins,b=>b.prob)

  // sanity: sum ≈ 1
  const prob_sum = bins.reduce((a,b)=>a+b.prob,0)
  if (Math.abs(prob_sum-1) > 1e-6) console.warn('Probabilities sum to', prob_sum)

  // scales & axes
  x.domain([0, max_speed*1.05])
  y.domain([0, max_prob*1.1])

  g_x.call(d3.axisBottom(x))
  g_y.call(d3.axisLeft(y))

  // bars
  const bar_g = svg.append('g').attr('id','group_bars')
  const bar_ratio = 0.8

  const bars = bar_g.selectAll('rect')
    .data(bins)
    .enter().append('rect')
      .attr('class','bin')
      .attr('id', (d,i)=> 'rect_' + i.toString())
      .attr('x', b=>{ const bw = x(b.x1)-x(b.x0); return x(b.x0) + (1-bar_ratio)*bw/2 })
      .attr('width', b=> (x(b.x1)-x(b.x0))*bar_ratio)
      .attr('y', b=> y(b.prob))
      .attr('height', b=> y(0)-y(b.prob))
      .attr('fill','#ccc')

  // latest observation and starting title
  const latest_bin = bins.find(b=>latest_obs.speed>=b.x0 && latest_obs.speed<b.x1) || bins[bins.length-1]

  title_sel.text(
      'Wind speed in Delft at ' + d3.timeFormat('%H:%M')(latest_obs.date) + ': '
    + latest_obs.speed.toFixed(1) + '\u00A0m/s'
    + '  (interval P\u2248' + (latest_bin.prob*100).toFixed(1) + '\u00A0%)'
    + (is_backup ? '  [backup]' : '')
  )

  // hover interaction (identical visuals)
  bars.on('mouseover', function(ev,b){
        d3.select(this).attr('fill','red')
        title_sel.text(
          'Wind speed interval ' + b.x0.toFixed(1) + '\u2013' + b.x1.toFixed(1) + '\u00A0m/s'
          + '  \u2192  P\u2248' + (b.prob*100).toFixed(2) + '\u00A0%')
      })
      .on('mousemove', ev=>{
        tip.style('left',(ev.pageX+10).toString()+'px')
           .style('top',(ev.pageY-28).toString()+'px')
           .style('display','none')
      })
      .on('mouseout', (ev,b)=>{
        d3.select(ev.currentTarget).attr('fill','#ccc')
        title_sel.text(
          'Wind speed in Delft at ' + d3.timeFormat('%H:%M')(latest_obs.date) + ': '
          + latest_obs.speed.toFixed(1) + '\u00A0m/s'
          + '  (interval P\u2248' + (latest_bin.prob*100).toFixed(1) + '\u00A0%)'
          + (is_backup ? '  [backup]' : '')
        )
      })
}

// error
function fatal(e){
  console.error(e)
  svg.append('text').attr('x',side/2).attr('y',side/2)
     .style('text-anchor','middle').style('font-size', fsz)
     .style('fill','red').text('Data load failed')
}

// =============================================================================
// helpers
// =============================================================================
async function load(url, is_backup=false){
  const r = await fetch(url)
  if(!r.ok) throw new Error(r.statusText)
  const j = await r.json()
  const t = j.hourly?.time, s = j.hourly?.wind_speed_10m
  if(!t || !s) throw new Error('schema')

  const data=[]
  for(let i=0;i<t.length;i++){
    const d=new Date(t[i]), v=s[i]
    if((is_backup || d<=now) && v!=null && isFinite(v)) data.push({date:d, speed:+v})
  }
  if(!data.length) throw new Error('no data')

  latest_obs = data[data.length-1]
  draw_histogram(data, is_backup)
}
</script>
</body>
</html>
