<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hypothesis Test Power Demo (Right-sided)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 16px 0;
        font-family: Helvetica, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #fff;
      }
      #plot {
        width: 100%;
        max-width: 760px;
        height: auto;
        display: block;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
        margin-top: 16px;
        width: 100%;
        max-width: 760px;
      }
      .control {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 220px;
      }
      .control label {
        font-size: 14px;
        margin-bottom: 6px;
      }
      .control input[type="range"] {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <svg id="plot" width="900" height="500"></svg>

    <div id="controls">
      <div class="control">
        <label id="label_mu" for="slider_mu"></label>
        <input type="range" min="100" max="400" value="200" id="slider_mu" class="slider">
      </div>
      <div class="control">
        <label id="label_sigma" for="slider_sigma"></label>
        <input type="range" min="50" max="200" value="100" id="slider_sigma" class="slider">
      </div>
      <div class="control">
        <label id="label_alpha" for="slider_alpha"></label>
        <input type="range" min="1" max="20" value="5" id="slider_alpha" class="slider">
      </div>
    </div>

    <script>
      const svg = d3.select("#plot");

      const margin = {top: 20, right: 20, bottom: 50, left: 60};
      let width = +svg.attr("width");
      let height = +svg.attr("height");
      let innerW = width - margin.left - margin.right;
      let innerH = height - margin.top - margin.bottom;

      const g = svg.append("g");

      const xScale = d3.scaleLinear().domain([-4, 8]);
      const yScale = d3.scaleLinear();

      const h0Label = g.append("text")
        .attr("id", "h0-label")
        .attr("text-anchor", "middle")
        .attr("font-size", 16)
        .attr("font-weight", "bold")
        .attr("fill", "black");

      const haLabel = g.append("text")
        .attr("id", "ha-label")
        .attr("text-anchor", "middle")
        .attr("font-size", 16)
        .attr("font-weight", "bold")
        .attr("fill", "orange");

      const criticalMarker = g.append("line")
        .attr("id", "critical-marker")
        .attr("stroke", "#333")
        .attr("stroke-width", 1.5)
        .attr("stroke-dasharray", "4,4");

      const criticalLabel = g.append("text")
        .attr("id", "critical-label")
        .attr("text-anchor", "middle")
        .attr("font-size", 14);

      criticalLabel.append("tspan").text("k");
      criticalLabel.append("tspan")
        .attr("font-size", "75%")
        .attr("baseline-shift", "sub")
        .text("\u03B1");

      const xAxis = g.append("g");
      const yAxis = g.append("g");

      const line = d3.line()
        .x(d => xScale(d.x))
        .y(d => yScale(d.y));

      const area = d3.area()
        .x(d => xScale(d.x))
        .y0(() => yScale(0))
        .y1(d => yScale(d.y));

      const legendItems = [
        {label: "Type I error (\u03B1)", fill: "red", opacity: 0.6},
        {label: "Type II error (\u03B2)", fill: "blue", opacity: 0.3},
        {label: "Power (\u03B3)", fill: "green", opacity: 0.3}
      ];

      const legend = g.append("g").attr("id", "legend");

      const legendEntry = legend.selectAll("g")
        .data(legendItems)
        .join("g")
        .attr("transform", (d, i) => `translate(0, ${i * 24})`);

      legendEntry.append("rect")
        .attr("width", 18)
        .attr("height", 18)
        .attr("fill", d => d.fill)
        .attr("opacity", d => d.opacity)
        .attr("stroke", "#333")
        .attr("stroke-width", 1);

      legendEntry.append("text")
        .attr("x", 24)
        .attr("y", 9)
        .attr("dominant-baseline", "middle")
        .attr("font-size", 14)
        .text(d => d.label);

      function positionLegend() {
        const padding = 8;
        const box = legend.node().getBBox();
        const legendWidth = box.width;
        const xPos = Math.max(0, innerW - legendWidth - padding);
        legend.attr("transform", `translate(${xPos}, ${padding})`);
      }

      function setDimensions() {
        const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
        width = Math.min(760, vw * 0.95);
        const targetHeight = width * 0.55;
        const availableHeight = vh > 0 ? Math.min(vh * 0.6, 460) : 460;
        height = Math.max(320, Math.min(targetHeight, availableHeight));
        svg.attr("width", width).attr("height", height);
        innerW = width - margin.left - margin.right;
        innerH = height - margin.top - margin.bottom;
        xScale.range([0, innerW]);
        yScale.range([innerH, 0]);
        g.attr("transform", `translate(${margin.left},${margin.top})`);
        xAxis.attr("transform", `translate(0,${innerH})`);
        positionLegend();
      }

      function pdf(x, mu, sigma) {
        return (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x - mu) / sigma, 2));
      }

      // rational approximation for inverse standard normal CDF (Acklam's method)
      function inversePhi(p) {
        if (p <= 0 || p >= 1) return NaN;
        const a1 = -39.6968302866538, a2 = 220.946098424521, a3 = -275.928510446969;
        const a4 = 138.357751867269, a5 = -30.6647980661472, a6 = 2.50662827745924;
        const b1 = -54.4760987982241, b2 = 161.585836858041, b3 = -155.698979859887;
        const b4 = 66.8013118877197, b5 = -13.2806815528857;
        const c1 = -0.00778489400243029, c2 = -0.322396458041136, c3 = -2.40075827716184;
        const c4 = -2.54973253934373, c5 = 4.37466414146497, c6 = 2.93816398269878;
        const d1 = 0.00778469570904146, d2 = 0.32246712907004, d3 = 2.445134137143;
        const d4 = 3.75440866190742;
        const p_low = 0.02425, p_high = 1 - p_low;
        let q, r;
        if (p < p_low) {
          q = Math.sqrt(-2 * Math.log(p));
          return (((((c1 * q + c2) * q + c3) * q + c4) * q + c5) * q + c6) /
                 ((((d1 * q + d2) * q + d3) * q + d4) * q + 1);
        }
        if (p <= p_high) {
          q = p - 0.5;
          r = q * q;
          return (((((a1 * r + a2) * r + a3) * r + a4) * r + a5) * r + a6) * q /
                 (((((b1 * r + b2) * r + b3) * r + b4) * r + b5) * r + 1);
        }
        q = Math.sqrt(-2 * Math.log(1 - p));
        return -(((((c1 * q + c2) * q + c3) * q + c4) * q + c5) * q + c6) /
                ((((d1 * q + d2) * q + d3) * q + d4) * q + 1);
      }

      function computeData(mu, sigma) {
        const xs = d3.range(-4, 8.01, 0.05);
        return xs.map(x => ({x, y: pdf(x, mu, sigma)}));
      }

      function update() {
        const mu = +document.getElementById("slider_mu").value / 100;
        const sigma = +document.getElementById("slider_sigma").value / 100;
        const alpha = +document.getElementById("slider_alpha").value / 100;

        document.getElementById("label_mu").textContent = "\u2207 = " + mu.toFixed(2);
        document.getElementById("label_sigma").textContent = "\u03C3 = " + sigma.toFixed(2);
        document.getElementById("label_alpha").textContent = "\u03B1 = " + (alpha * 100).toFixed(1) + "%";

        const dataH0 = computeData(0, 1);
        const dataHa = computeData(mu, sigma);

        yScale.domain([0, d3.max([...dataH0, ...dataHa], d => d.y) * 1.1]);

        xAxis.call(d3.axisBottom(xScale));
        yAxis.call(d3.axisLeft(yScale));

        const c = inversePhi(1 - alpha);

        g.selectAll("#h0").data([dataH0])
          .join("path")
          .attr("id", "h0")
          .attr("d", line)
          .attr("stroke", "black")
          .attr("fill", "none")
          .attr("stroke-width", 2);

        g.selectAll("#ha").data([dataHa])
          .join("path")
          .attr("id", "ha")
          .attr("d", line)
          .attr("stroke", "orange")
          .attr("fill", "none")
          .attr("stroke-width", 2);

        g.selectAll(".shade").remove();

        const typeI = dataH0.filter(d => d.x >= c);
        if (typeI.length > 1) {
          g.append("path")
            .datum(typeI)
            .attr("class", "shade")
            .attr("d", area)
            .attr("fill", "red")
            .attr("opacity", 0.6);
        }

        const typeII = dataHa.filter(d => d.x <= c);
        if (typeII.length > 1) {
          g.append("path")
            .datum(typeII)
            .attr("class", "shade")
            .attr("d", area)
            .attr("fill", "blue")
            .attr("opacity", 0.3);
        }

        const power = dataHa.filter(d => d.x >= c);
        if (power.length > 1) {
          g.append("path")
            .datum(power)
            .attr("class", "shade")
            .attr("d", area)
            .attr("fill", "green")
            .attr("opacity", 0.3);
        }

        const [rangeBottom, rangeTop] = yScale.range();
        criticalMarker
          .attr("x1", xScale(c))
          .attr("x2", xScale(c))
          .attr("y1", rangeTop)
          .attr("y2", rangeBottom);
        criticalMarker.raise();

        criticalLabel
          .attr("x", xScale(c))
          .attr("y", rangeBottom + 26);
        criticalLabel.raise();

        h0Label
          .attr("x", xScale(0))
          .attr("y", Math.max(12, yScale(pdf(0, 0, 1)) - 12))
          .text("\u210B\u2080");    // ℋ₀
        haLabel
          .attr("x", xScale(mu))
          .attr("y", Math.max(12, yScale(pdf(mu, mu, sigma)) - 12))
          .text("\u210B\u2090");    // ℋ₁
      }

      setDimensions();
      update();

      d3.selectAll(".slider").on("input", update);

      window.addEventListener("resize", () => {
        setDimensions();
        update();
      });
    </script>
  </body>
</html>
