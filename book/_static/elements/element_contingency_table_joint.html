    // This function converts pixels to values
    function pixels_to_values(coords,axis) {
    	axis = (typeof axis === 'undefined') ? 'xy' : axis;
    	if (axis == 'x') {
      	res = (coords-window_x[0])/(window_x[1]-window_x[0]) * (xrange[1]-xrange[0]) + xrange[0]
      } else if (axis == 'y') {
      	res = (1.-(coords-window_y[0])/(window_y[1]-window_y[0])) * (yrange[1]-yrange[0]) + yrange[0]
      } else {
      	res = [(coords[0]-window_x[0])/(window_x[1]-window_x[0]) * (xrange[1]-xrange[0]) + xrange[0],(1.-(coords[1]-window_y[0])/(window_y[1]-window_y[0])) * (yrange[1]-yrange[0]) + yrange[0]]
      }
     	return res;
    }

		// This function converts values to pixels
    function values_to_pixels(values,axis) {
    	axis = (typeof axis === 'undefined') ? 'xy' : axis;
    	if (axis == 'x') {
      	res = (values-xrange[0])/(xrange[1]-xrange[0])*(window_x[1]-window_x[0])+window_x[0];
      } else if (axis == 'y') {
      	res = (1-(values-yrange[0])/(yrange[1]-yrange[0]))*(window_y[1]-window_y[0])+window_y[0];
      } else {
      	res = [(values[0]-xrange[0])/(xrange[1]-xrange[0])*(window_x[1]-window_x[0])+window_x[0],(1-(values[1]-yrange[0])/(yrange[1]-yrange[0]))*(window_y[1]-window_y[0])+window_y[0]];
      }
     	return res;
    }
    
		function array_to_string(array) {

      for (let row = 0; row < array.length; row++) {

      }
      return string
    }

    function percentRound(ipt, precision) {
    		// I took this function from https://www.npmjs.com/package/percent-round
        if (!precision) {
            precision = 0;
        }
        if (!Array.isArray(ipt)) {
            throw new Error('percentRound input should be an Array');
        }
        const iptPercents = ipt.slice();
        const length = ipt.length;
        const out = new Array(length);

        let total = 0;
        for (let i = length - 1; i >= 0; i--) {
            if (typeof iptPercents[i] === "string") {
                iptPercents[i] = Number.parseFloat(iptPercents[i]);
            }
            total += iptPercents[i] * 1;
        }
        if (isNaN(total)) {
            throw new Error('percentRound invalid input');
        }

        if (total === 0) {
            out.fill(0);
        } else {
            const powPrecision = Math.pow(10, precision);
            const pow100 = 100 * powPrecision;
            let check100 = 0;
            for (let i = length - 1; i >= 0; i--) {
                iptPercents[i] = 100 * iptPercents[i] / total;
                check100 += out[i] = Math.round(iptPercents[i] * powPrecision);
            }

            if (check100 !== pow100) {
                const totalDiff = (check100 - pow100) ;
                const roundGrain = 1;
                let grainCount = Math.abs(totalDiff);
                const diffs = new Array(length);

                for (let i = 0; i < length; i++) {
                    diffs[i] = Math.abs(out[i] - iptPercents[i] * powPrecision);
                }

                while (grainCount > 0) {
                    let idx = 0;
                    let maxDiff = diffs[0];
                    for (let i = 1; i < length; i++) {
                        if (maxDiff < diffs[i]) {
                            // avoid negative result
                            if (check100 > pow100 && out[i] - roundGrain < 0) {
                                continue;
                            }
                            idx = i;
                            maxDiff = diffs[i];
                        }
                    }
                    if (check100 > pow100) {
                        out[idx] -= roundGrain;
                    } else {
                        out[idx] += roundGrain;
                    }
                    diffs[idx] -= roundGrain;
                    grainCount--;
                }
            }

            if (powPrecision > 1) {
                for (let i = 0; i < length; i++) {
                    out[i] = out[i] / powPrecision;
                }
            }
        }

        return out;
    }

    function findIndexOfLowestValue(arr) {
      if (arr.length === 0) {
        return -1; // Handle the case where the array is empty.
      }

      return arr.reduce((lowestIndex, currentValue, currentIndex, array) => {
        return currentValue < array[lowestIndex] ? currentIndex : lowestIndex;
      }, 0);
    }
